  <td class="image-cell">
    <img class="product-image" [src]="item().product.image" [alt]="item().product.name" />
  </td>
  <td class="product-cell">
    <a class="product-link" [routerLink]="item().product.get_absolute_url">
      {{ item().product.name }}
    </a>
    @if (item().variations.length) {
      <div class="variations">
        @for (variation of item().variations; track variation.id) {
          <p>{{ variation.variation_category }}: {{ variation.variation_value }}</p>
        }
      </div>
    }
  </td>
  <td>${{ item().product.price }}</td>
  <td class="quantity-cell">
    <button
      mat-icon-button
      type="button"
      aria-label="Decrease quantity"
      (click)="decrementQuantity()"
    >
      <mat-icon>remove</mat-icon>
    </button>
    <span class="quantity">{{ item().quantity }}</span>
    <button
      mat-icon-button
      type="button"
      aria-label="Increase quantity"
      (click)="incrementQuantity()"
    >
      <mat-icon>add</mat-icon>
    </button>
  </td>
  <td>${{ lineTotal(item()) | number: '1.2-2' }}</td>
  <td>
    <button mat-icon-button type="button" aria-label="Remove item" (click)="removeLine()">
      <mat-icon>delete_outline</mat-icon>
    </button>
  </td>
