<section class="search-section">
  @if (query()) {
    <h2>Search results for "{{ query() }}"</h2>
  } @else {
    <h2>Search</h2>
  }

  @if (isLoading()) {
    <app-card-grid-skeleton />
  } @else if (products().length > 0) {
    <app-products-grid [products]="products()" />
  } @else if (query()) {
    <app-empty-state title="Nothing was found." />
  }
</section>
