<mat-card class="product-card">
  <img
    mat-card-image
    class="card-image"
    [src]="product().image"
    [alt]="product().name"
  />
  <mat-card-header>
    <mat-card-title>{{ product().name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="card-body">
    <p class="description">{{ product().description }}</p>
    <p class="price">${{ product().price }}</p>
  </mat-card-content>
  <mat-divider />
  <div class="card-actions">
    <a mat-flat-button color="primary" [routerLink]="product().get_absolute_url">Details</a>
  </div>
</mat-card>
