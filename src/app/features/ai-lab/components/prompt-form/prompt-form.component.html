<mat-card class="prompt-form-card">
  <form (submit.prevent)="submitForm()" method="post">
    <mat-card-content>
      <mat-form-field appearance="outline" class="prompt-field">
        <mat-label>Prompt</mat-label>
        <textarea
          matInput
          rows="4"
          maxlength="500"
          placeholder="How can I help?"
          [ngModel]="body()"
          (ngModelChange)="body.set($event)"
          name="prompt"
          required
          (keydown)="handleKeydown($event)"
        ></textarea>
        <mat-hint align="end">{{ body().length }}/500</mat-hint>
      </mat-form-field>
    </mat-card-content>

    @if (uploadingImages()) {
      <div class="upload-spinner">
        <mat-progress-spinner mode="indeterminate" diameter="32" />
      </div>
    } @else if (showAddImages() && promptImages().length > 0) {
      <div class="prompt-images">
        @for (image of promptImages(); track image; let index = $index) {
          <div class="prompt-image-wrapper">
            <button
              mat-icon-button
              type="button"
              class="remove-btn"
              aria-label="Remove image"
              (click)="removeImage(index)"
            >
              <mat-icon>close</mat-icon>
            </button>
            <img [src]="image" alt="Uploaded prompt image" />
          </div>
        }
      </div>
    }

    <mat-divider />

    <div class="form-actions">
      @if (showAddImages()) {
        <input
          #fileInput
          type="file"
          hidden
          accept="image/png, image/jpeg"
          multiple
          (change)="handleFileChange($event)"
        />
        <button mat-stroked-button type="button" (click)="chooseFiles(fileInput)">
          Add Images
        </button>
      } @else {
        <span></span>
      }

      <button mat-flat-button color="primary" type="submit">
        {{ submitLabel() }}
      </button>
    </div>
  </form>
</mat-card>
