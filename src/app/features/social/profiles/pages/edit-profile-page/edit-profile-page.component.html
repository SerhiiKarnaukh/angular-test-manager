<mat-card>
  <mat-card-header>
    <mat-card-title>Edit Profile</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submitForm()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="first_name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="last_name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <div class="avatar-field">
        <label for="avatarUpload">Avatar</label>
        <input id="avatarUpload" type="file" accept="image/png, image/jpeg" (change)="onAvatarSelected($event)" />
      </div>

      <mat-divider />

      <div class="form-actions">
        <a mat-stroked-button routerLink="/social/edit/password">Edit Password</a>
        <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
          Save changes
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
