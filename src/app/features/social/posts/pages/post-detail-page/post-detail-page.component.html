<app-social-page-layout>
  <div main>
    @if (isLoading() && !postLoaded()) {
      <mat-card class="loading-card">
        <mat-progress-spinner mode="indeterminate" diameter="40" />
      </mat-card>
    } @else if (post().id) {
      <app-social-post-card [post]="post()" />

      @for (comment of post().comments; track comment.id) {
        <app-comment-item [comment]="comment" />
      }

      @if (isAuthenticated()) {
        <mat-card class="comment-form-card">
          <form (ngSubmit)="submitComment()">
            <mat-card-content>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>What do you think?</mat-label>
                <textarea matInput rows="3" [formControl]="commentControl"></textarea>
              </mat-form-field>
            </mat-card-content>

            <div class="form-actions">
              <button mat-flat-button color="primary" type="submit">Comment</button>
            </div>
          </form>
        </mat-card>
      }
    }
  </div>

  <div sidebar>
    <app-people-you-may-know />
    <app-trends />
  </div>
</app-social-page-layout>
