<app-social-page-layout>
  <div main>
    @if (isAuthenticated()) {
      <app-create-post-form />
    }

    @if (isLoading() && !posts().length) {
      <app-post-list-skeleton />
    } @else {
      @for (post of posts(); track post.id) {
        <app-social-post-card [post]="post" />
      }

      @if (!isLoading() && !isPaginationLoading() && !posts().length) {
        <app-empty-state title="No posts yet." message="Be the first to share something!" />
      }
    }

    @if (isPaginationLoading()) {
      <div class="loading-row">
        <mat-progress-spinner mode="indeterminate" diameter="40" />
      </div>
    }
  </div>

  <div sidebar>
    <app-people-you-may-know />
    <app-trends />
  </div>
</app-social-page-layout>
