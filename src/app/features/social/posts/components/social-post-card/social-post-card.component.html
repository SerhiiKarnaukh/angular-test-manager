<mat-card class="post-card">
  <mat-card-header>
    <img mat-card-avatar [src]="avatarUrl()" [alt]="authorName()" />
    <mat-card-title>
      <a [routerLink]="['/social/profile', post().created_by.slug]">{{ authorName() }}</a>
    </mat-card-title>
    <mat-card-subtitle>{{ post().created_at_formatted }} ago</mat-card-subtitle>

    @if (isAuthenticated()) {
      <button
        mat-icon-button
        type="button"
        class="post-menu-trigger"
        [matMenuTriggerFor]="postMenu"
        aria-label="Post actions"
      >
        <mat-icon>more_vert</mat-icon>
      </button>

      <mat-menu #postMenu="matMenu">
        @if (!isOwnPost()) {
          <button mat-menu-item type="button" (click)="reportPost()">
            <mat-icon>flag</mat-icon>
            Report Post
          </button>
        } @else {
          <button mat-menu-item type="button" (click)="deletePost()">
            <mat-icon>delete</mat-icon>
            Delete Post
          </button>
        }
      </mat-menu>
    }
  </mat-card-header>

  <mat-card-content>
    <p class="post-body">{{ post().body }}</p>

    @for (image of post().attachments; track image.id) {
      <img class="post-image" [src]="image.image_url" alt="Post attachment" />
    }
  </mat-card-content>

  <div class="card-actions">
    <button mat-button type="button" (click)="likePost()">
      <mat-icon>thumb_up</mat-icon>
      {{ likesCount() }}
    </button>

    <a mat-button [routerLink]="['/social', post().id]">
      <mat-icon>comment</mat-icon>
      {{ post().comments_count }} comments
    </a>

    @if (post().is_private) {
      <span class="private-label">
        <mat-icon>visibility_off</mat-icon>
        Private
      </span>
    }
  </div>
</mat-card>
