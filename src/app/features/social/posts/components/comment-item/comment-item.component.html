<mat-card class="comment-card">
  <mat-card-header>
    <img mat-card-avatar [src]="avatarUrl()" [alt]="authorName()" />
    <mat-card-title>
      <a [routerLink]="['/social/profile', comment().created_by.slug]">{{ authorName() }}</a>
    </mat-card-title>
    <mat-card-subtitle>{{ comment().created_at_formatted }} ago</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ comment().body }}</p>
  </mat-card-content>
</mat-card>
