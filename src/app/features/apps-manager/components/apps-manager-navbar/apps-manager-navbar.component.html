<mat-toolbar class="navbar apps-toolbar">
  <a routerLink="/" class="brand">
    <mat-icon class="brand-icon">apps</mat-icon>
    <span class="brand-copy">
      <span class="brand-title">Angular Apps Manager</span>
      <span class="brand-subtitle">Portfolio launcher</span>
    </span>
  </a>

  <span class="spacer"></span>

  @if (!isHandset()) {
    <nav class="nav-actions">
      <button mat-button [matMenuTriggerFor]="appsMenu" type="button">
        <mat-icon>grid_view</mat-icon>
        Apps Manager
      </button>
      <mat-menu #appsMenu="matMenu" class="apps-manager-nav-menu">
        <a mat-menu-item [href]="remoteHost" target="_blank" rel="noopener">
          <mat-icon>public</mat-icon>
          All Apps
        </a>
        <a
          mat-menu-item
          routerLink="/"
          routerLinkActive="menu-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon>view_module</mat-icon>
          Angular Apps
        </a>
      </mat-menu>

      @for (link of topbarLinks(); track link.key) {
        <a mat-button [href]="link.url" target="_blank" rel="noopener">
          <i [class]="link.icon_class" class="topbar-link-icon" aria-hidden="true"></i>
          {{ link.title }}
        </a>
      }

      <span class="nav-divider" aria-hidden="true"></span>

      <button
        mat-icon-button
        type="button"
        class="nav-icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Light mode' : 'Dark mode'"
      >
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        class="nav-icon-btn"
        aria-label="Search"
        (click)="openSearchDialog()"
      >
        <mat-icon>search</mat-icon>
      </button>
    </nav>
  } @else {
    <button
      mat-icon-button
      type="button"
      aria-label="Open menu"
      [matMenuTriggerFor]="mobileMenu"
      (menuOpened)="mobileMenuOpen.set(true)"
      (menuClosed)="mobileMenuOpen.set(false)"
    >
      <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>

    <mat-menu #mobileMenu="matMenu" class="apps-manager-nav-menu">
      <button mat-menu-item type="button" [matMenuTriggerFor]="mobileAppsMenu">
        <mat-icon>grid_view</mat-icon>
        Apps Manager
      </button>
      <mat-menu #mobileAppsMenu="matMenu" class="apps-manager-nav-menu">
        <a mat-menu-item [href]="remoteHost" target="_blank" rel="noopener" (click)="closeMobileMenu()">
          <mat-icon>public</mat-icon>
          All Apps
        </a>
        <a
          mat-menu-item
          routerLink="/"
          routerLinkActive="menu-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
        >
          <mat-icon>view_module</mat-icon>
          Angular Apps
        </a>
      </mat-menu>

      <mat-divider />

      @for (link of topbarLinks(); track link.key) {
        <a
          mat-menu-item
          [href]="link.url"
          target="_blank"
          rel="noopener"
          (click)="closeMobileMenu()"
        >
          <i [class]="link.icon_class" class="topbar-link-icon" aria-hidden="true"></i>
          {{ link.title }}
        </a>
      }

      <mat-divider />

      <button mat-menu-item type="button" (click)="theme.toggle(); closeMobileMenu()">
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        {{ theme.isDark() ? 'Light mode' : 'Dark mode' }}
      </button>
      <button mat-menu-item type="button" (click)="openSearchDialog(); closeMobileMenu()">
        <mat-icon>search</mat-icon>
        Search
      </button>
    </mat-menu>
  }
</mat-toolbar>
